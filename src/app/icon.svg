  <!--
    Ex-libris: paper, monogram, rule. Real EB Garamond capitals as OUTLINES,
    never <text> — a favicon renders outside the page, where no @font-face is
    loaded and no font stack is honoured, so <text> would fall back to a
    different typeface on every machine.
    Regenerate: instance EB Garamond at wght=400, draw 'L' and 'P' through
    translate(11.0559,40)·scale(40/1144,-40/1144), P advanced 644 (its own 584
    + 60 tracking — tracking is what stops a monogram reading as a word).
  -->
  <style>
    :root { --field: #f7f3ea; --mark: #1a1714; --rule: #8a6a1f; }
    @media (prefers-color-scheme: dark) {
      :root { --field: #12100e; --mark: #e7e0d2; --rule: #c9a227; }
    }
  </style>
